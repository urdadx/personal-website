    <path d="M1009 79 L898 170" stroke="#d94a42" stroke-width="7"/>
  </g>

  <!-- Sparse handwritten annotations. -->
  <g font-family="DejaVu Sans, sans-serif" font-weight="700" letter-spacing="2">
    <text x="335" y="115" fill="#181818" font-size="25">OLD LAPTOP</text>
    <path d="M338 123 q87 9 172-1" fill="none" stroke="#181818" stroke-width="3" stroke-linecap="round"/>

    <path d="M309 377 l4-10 M316 380 l4-10" stroke-width="3"/>
  </g>

  <!-- Services emerge from the home server without becoming a formal diagram. -->
  <g fill="none" stroke="#181818" stroke-linecap="round" stroke-linejoin="round">
    <path d="M820 202 q33-34 67-4 q46-22 63 20 q40 2 37 37 q-3 27-39 27 L834 281 q-43-1-45-35 q-2-31 31-44z" stroke-width="4"/>
    <path d="M841 250 q17-19 36 0 q18-19 36 0" stroke="#2775bd" stroke-width="4"/>
    <circle cx="943" cy="244" r="6" fill="#2775bd" stroke="none"/>
    <path d="M851 334 q20-28 40 0 q20-28 40 0 q-1 36-40 54 q-39-18-40-54z" stroke-width="4"/>
    <path d="M875 348 l11 11 l23-28" stroke="#2775bd" stroke-width="5"/>
    <path d="M967 368 l37-16 l37 16 l-37 18z M967 368 v46 l37 18 l37-18 v-46 M1004 386 v46" stroke-width="4"/>
  </g>

  <!-- The recurring cloud bill is rejected. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M891 91 q21-30 51-6 q35-16 51 17 q31 1 32 27 q0 28-34 29 l-92-1 q-31-1-32-27 q-1-25 24-39z" stroke="#181818" stroke-width="4"/>

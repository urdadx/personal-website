    <path d="M359 177 Q357 169 369 168 L751 170 L758 380 L344 377 Z" stroke-width="3"/>
    <path d="M300 414 Q294 416 301 426 L325 451 Q332 458 350 458 L784 459 Q802 458 810 450 L830 426 Q836 416 825 415 Z" stroke-width="5"/>

    <circle cx="589" cy="305" r="7" fill="#181818" stroke="none"/>
    <path d="M545 331 q18 9 36 0" stroke-width="3"/>
  </g>

  <!-- Xiaohei performs the core action: connecting the machine. -->
  <g stroke="#181818" stroke-linecap="round" stroke-linejoin="round">
    <path d="M169 352 Q171 299 210 286 Q251 283 263 331 L258 426 Q238 448 190 436 Q168 422 169 352Z" fill="#181818" stroke-width="4"/>
    <circle cx="205" cy="329" r="7" fill="#fff" stroke="none"/>
    <circle cx="235" cy="329" r="7" fill="#fff" stroke="none"/>
    <path d="M190 435 Q181 474 170 502 M236 439 Q247 474 246 506" fill="none" stroke-width="5"/>
    <path d="M151 505 q20-5 28 1 M237 507 q20-4 28 3" fill="none" stroke-width="5"/>
    <path d="M258 359 Q285 357 306 389" fill="none" stroke-width="5"/>
    <circle cx="309" cy="392" r="8" fill="#181818" stroke="none"/>
  </g>

  <!-- Network cable carries the laptop's second life. -->
  <g fill="none" stroke="#ee6b2f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M303 390 Q270 492 367 510 Q495 534 612 496 Q706 466 767 490 Q837 516 890 468" stroke-width="7"/>
    <path d="M882 462 l17-4 l-5 18" stroke-width="6"/>

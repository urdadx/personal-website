    <circle cx="704" cy="201" r="7" fill="#ee6b2f" stroke="none"/>
    <circle cx="730" cy="201" r="7" fill="#2775bd" stroke="none"/>
    <path d="M704 226 L704 251 M730 226 L730 267" stroke-width="3"/>
    <path d="M704 251 q13 11 26 0" stroke="#ee6b2f" stroke-width="4"/>
    <path d="M481 277 q82-54 165 0 q-7 72-83 72 q-75-1-82-72z" stroke-width="4"/>

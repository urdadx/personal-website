    <path d="M663 382 q90 11 181 2" fill="none" stroke="#d94a42" stroke-width="3" stroke-linecap="round"/>
    <text x="91" y="269" fill="#2775bd" font-size="21">PLUG IT IN</text>
    <path d="M158 277 q35 13 48 3" fill="none" stroke="#2775bd" stroke-width="3"/>
    <text x="897" y="126" fill="#d94a42" font-size="21">$14 / MO</text>
    <text x="845" y="530" fill="#ee6b2f" font-size="24">HOME SERVER</text>
  </g>

  <!-- Small motion marks keep the sketch alive. -->
  <g fill="none" stroke-linecap="round">
    <path d="M284 311 l24-16 M295 328 l30-5" stroke="#ee6b2f" stroke-width="4"/>
    <path d="M789 177 l18-20 M803 190 l27-7" stroke="#2775bd" stroke-width="4"/>
    <path d="M1054 302 l18-8 M1057 318 l22 3" stroke="#181818" stroke-width="3"/>
  </g>
</svg>

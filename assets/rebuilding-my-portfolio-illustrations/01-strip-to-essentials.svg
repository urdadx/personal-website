    <circle cx="450" cy="148" r="7" fill="#ee6b2f" stroke="none"/>
    <circle cx="476" cy="148" r="7" fill="#2775bd" stroke="none"/>
    <path d="M471 250 q93-8 186 0 M470 275 q152-7 303 0 M470 301 q126-5 252 1" stroke-width="4"/>
    <path d="M470 360 q78-5 155 0 M470 385 q124-5 247 1 M470 411 q98-5 197 0" stroke-width="3"/>
    <path d="M843 244 q55-25 106 3 l-1 150 q-50 23-104 0z" stroke-width="4"/>

    <circle cx="897" cy="292" r="16" stroke="#ee6b2f" stroke-width="4"/>
  </g>

  <!-- Xiaohei earnestly pushes a giant eraser through the old site's noise. -->
  <g stroke="#181818" stroke-linecap="round" stroke-linejoin="round">
    <path d="M235 328 Q236 278 276 267 Q318 269 328 313 L324 411 Q307 432 260 422 Q236 408 235 328Z" fill="#181818" stroke-width="4"/>

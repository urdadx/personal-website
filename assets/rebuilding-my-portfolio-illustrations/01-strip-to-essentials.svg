<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#fff"/>

  <!-- A minimal browser frame emerging from the erased clutter. -->
  <g fill="none" stroke="#181818" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390 135 Q388 119 405 118 L1006 120 Q1021 120 1020 137 L1016 493 Q1016 506 1001 506 L402 504 Q388 504 390 489 Z" stroke-width="5"/>
    <path d="M391 175 Q660 180 1019 176" stroke-width="4"/>
